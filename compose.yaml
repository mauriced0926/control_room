# docker compose up: the control room on http://127.0.0.1:8090/ (demo logins in README.md).
# Needs GATEWAY_HOST, GATEWAY_PORT and GATEWAY_EMAIL, from the environment or a .env file beside this.
services:
  control-room:
    build: .
    image: dlh-control-room
    restart: unless-stopped
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:?set GATEWAY_HOST}
      GATEWAY_PORT: ${GATEWAY_PORT:?set GATEWAY_PORT}
      GATEWAY_EMAIL: ${GATEWAY_EMAIL:?set GATEWAY_EMAIL}
      # Behind a TLS proxy, the public address (e.g. https://cr.example.com): the service checks
      # Origin and Host against it, and marks the session cookie Secure when it is https.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      # Published on this machine only. Docker's published ports can bypass a host firewall, so
      # anything public goes through a reverse proxy instead.
      - "127.0.0.1:8090:8090"
    volumes:
      - control-room-data:/app/data

volumes:
  control-room-data:
